replicaCount: 1
batchName: optimized
image:
  repository: chart-analyzer-optimized
  pullPolicy: IfNotPresent
  tag: 0.15.0-optimized.1
imagePullSecrets: []
nameOverride: chart-analyzer-optimized
fullnameOverride: chart-analyzer-optimized
serviceAccount:
  create: true
  automount: true
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8000
ingress:
  enabled: false
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: chartanalyzer
  hosts:
  - host: nzt88ubuntuserver.ibis-silverside.ts.net
    paths:
    - path: /
      pathType: Prefix
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
istio:
  enabled: false
  headerName: batch-name
  defaultBatchName: batch-1
  batches:
  - name: batch-1
  - name: batch-2
  - name: batch-3
  - name: batch-4
  - name: batch-5
  - name: batch-6
  service:
    create: true
    name: chart-analyzer-istio
    port: 8000
  gateway:
    name: chart-analyzer-gateway
    selector:
      istio: ingress
    servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
      - nzt88ubuntuserver.ibis-silverside.ts.net
  virtualService:
    name: chart-analyzer
    hosts:
    - nzt88ubuntuserver.ibis-silverside.ts.net
  destinationRule:
    name: chart-analyzer
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
volumes:
- name: config
  configMap:
    name: chart-analyzer-optimized-config
volumeMounts:
- name: config
  mountPath: /config/config.yaml
  subPath: config.yaml
  readOnly: true
nodeSelector: {}
tolerations: []
affinity: {}
envFrom:
  enabled: true
configEnv:
  CHART_ANALYZER_CONFIG: /config/config.yaml
  CHART_ANALYZER_HOST: 0.0.0.0
  CHART_ANALYZER_PORT: '8000'
  CHART_ANALYZER_MONGODB_DATABASE: chart_analyzer_optimized
setupMapName: chart-analyzer-optimized-config
appSetup:
  sectors:
  - Commercial services
  - Communications
  - Consumer durables
  - Consumer non-durables
  - Consumer services
  mongodb:
    uri: mongodb://mongodb:27017
    database: chart_analyzer_optimized
    server_selection_timeout_ms: 5000
  service:
    poll_interval_seconds: 300
    event_detection_interval_seconds: 300
    download_batch_size: 20
    download_workers: 4
    download_timeout_seconds: 10
  timeframes:
  - name: daily
    interval: 1d
    period: 3y
    indicators:
    - macd
    - rsi
    - ema_50
    - ema_200
    - volume_sma
    - bollinger_bands
    - volume_at_price
    - price_stddev
    - support_resistance
    - volume_price_analysis
  - name: intraday_15m
    interval: 15m
    period: 5d
    indicators:
    - macd
    - rsi
    - ema_50
    - ema_200
  indicators:
    rsi:
      window: 14
    ema_50:
      window: 50
    ema_200:
      window: 200
    volume_sma:
      window: 20
    bollinger_bands:
      window: 20
      standard_deviations: 2
    volume_at_price:
      lookback: 90
      price_bins: 24
    price_stddev:
      periods:
      - 20
      - 60
      - 120
    macd:
      fast: 12
      slow: 26
      signal: 9
    support_resistance:
      lookback: 60
      pivot_window: 3
    volume_price_analysis:
      volume_ma_window: 20
  events:
    position_entry:
      timeframe: daily
      operator: AND
      conditions:
        macd_cross_over: {}
        ema50_above_ema200: {}
        rsi_between:
          min: 30
          max: 70
        volume_price_up:
          min_relative_volume: 0.9
          direction: up
    position_exit:
      timeframe: daily
      operator: OR
      conditions:
        macd_cross_under: {}
